# EduTutor Math 9 - cấu hình ứng dụng (Spring MVC thuần, KHÔNG dùng khóa spring.datasource.*).
# Có thể ghi đè bằng biến môi trường / -D: DB_URL, DB_USER, DB_PASS, UPLOAD_DIR
db.url=jdbc:sqlserver://localhost:1433;databaseName=MathTutorDB;encrypt=true;trustServerCertificate=true
db.username=sa
db.password=123
db.pool.max-size=10

# Hibernate: script SQL (document/sql) là nguồn sự thật, Hibernate KHÔNG được tự tạo/sửa bảng
hibernate.hbm2ddl.auto=none
hibernate.show_sql=false
hibernate.format_sql=true
hibernate.jdbc.batch_size=20
hibernate.order_inserts=true
hibernate.default_batch_fetch_size=16

# Thư mục lưu ảnh bài làm tự luận (nằm ngoài webapp để không mất khi redeploy)
app.upload-dir=C:/edututor/uploads
app.upload.max-bytes=5242880

# Thread pool cho các lời gọi AI bất đồng bộ
app.ai.executor.core=4
app.ai.executor.max=8
app.ai.executor.queue=50

# Gemini REST API (khóa API, model, nhiệt độ... nằm ở bảng AiConfigs, Admin sửa trên giao diện)
gemini.baseUrl=https://generativelanguage.googleapis.com/v1beta
gemini.connectTimeoutSeconds=15
gemini.requestTimeoutSeconds=60
gemini.maxParseRetries=3
# Giảm thời gian chấm: 0 = tắt "thinking" (model Gemini 2.5 trở lên). Để trống nếu model báo lỗi 400
gemini.thinkingBudget=0
# Model dự phòng khi model chính quá tải (503) hoặc timeout; để trống để tắt
gemini.fallbackModel=gemini-3.5-flash-lite
