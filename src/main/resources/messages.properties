# Thông báo kiểm tra dữ liệu (Bean Validation) - tiếng Việt, mã hóa UTF-8.
# Khóa dùng trong chú thích: message = "{val.username.required}" ...

# --- Đăng ký / tài khoản (VAL-01 .. VAL-04) ---
val.username.required=Vui lòng nhập tên đăng nhập.
val.username.invalid=Tên đăng nhập phải từ 4-30 ký tự, chỉ gồm chữ cái, số, dấu gạch dưới và dấu chấm.
val.password.required=Vui lòng nhập mật khẩu.
val.password.size=Mật khẩu phải từ {min} đến {max} ký tự.
val.password.complexity=Mật khẩu phải có cả chữ cái và chữ số.
val.confirmPassword.required=Vui lòng nhập lại mật khẩu để xác nhận.
val.fullName.required=Vui lòng nhập họ tên.
val.fullName.size=Họ tên phải từ {min} đến {max} ký tự.
val.fullName.html=Họ tên không được chứa ký tự < hoặc >.
val.email.required=Vui lòng nhập email.
val.email.invalid=Địa chỉ email không đúng định dạng.
val.email.size=Email tối đa {max} ký tự.

# --- Quản trị người dùng (VAL-05) ---
val.role.required=Vui lòng chọn vai trò.
val.role.invalid=Vai trò không hợp lệ.
val.status.required=Vui lòng chọn trạng thái.
val.status.invalid=Trạng thái không hợp lệ (chỉ ACTIVE hoặc SUSPENDED).

# --- Chuyên đề, bài học (VAL-06, VAL-07, VAL-08) ---
val.topicName.required=Tên chủ đề không được để trống.
val.topicName.size=Tên chủ đề phải từ {min} đến {max} ký tự.
val.description.size=Mô tả tối đa {max} ký tự.
val.lesson.topic.required=Vui lòng chọn chủ đề hợp lệ.
val.lessonName.required=Tiêu đề bài học không được để trống.
val.lessonName.size=Tiêu đề bài học phải từ {min} đến {max} ký tự.
val.lesson.summary.size=Tóm tắt bài học tối đa {max} ký tự.
val.lesson.content.size=Nội dung bài học quá dài.

# --- Câu hỏi (VAL-09, VAL-10, VAL-11) ---
val.question.lesson.required=Vui lòng chọn bài học hợp lệ.
val.question.type.invalid=Loại câu hỏi không hợp lệ.
val.question.level.invalid=Mức độ phải là 1 (Dễ), 2 (Trung bình) hoặc 3 (Khó).
val.question.content.required=Nội dung câu hỏi không được để trống.
val.question.content.size=Nội dung câu hỏi tối đa {max} ký tự.
val.question.explanation.size=Lời giải tối đa {max} ký tự.

# --- Bài giảng (VAL-08) ---
val.material.type.required=Vui lòng chọn loại bài giảng.
val.material.type.invalid=Loại bài giảng không hợp lệ.
val.material.title.required=Tiêu đề bài giảng không được để trống.
val.material.title.size=Tiêu đề bài giảng tối đa {max} ký tự.
val.material.url.size=Đường dẫn tối đa {max} ký tự.
val.material.content.size=Nội dung bài giảng tối đa {max} ký tự.
val.material.order.range=Thứ tự hiển thị phải từ {min} đến {max}.

# --- Chấm bài, sinh đề, gia sư AI (VAL-12, VAL-19, VAL-21) ---
val.teacherComment.size=Nhận xét của giáo viên tối đa {max} ký tự.
val.generate.lesson.required=Vui lòng chọn bài học cần sinh câu hỏi.
val.generate.count.range=Số câu phải từ {min} đến {max}.
val.batch.empty=Không có câu hỏi nào để lưu.
val.quiz.question.required=Thiếu mã câu hỏi.
val.quiz.option.required=Thiếu phương án đã chọn.
val.tutor.input.required=Vui lòng nhập bài toán hoặc câu trả lời của bạn.
val.tutor.input.size=Nội dung tối đa {max} ký tự.

